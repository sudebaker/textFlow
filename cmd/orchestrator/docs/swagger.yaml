  textflow_internal_models.JobStatus:
    enum:
    - pending
    - extracting
    - processing
    - embedding
    - entities
    - inferences
    - transcribing
    - analyzing_image
    - completed
    - failed
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusExtracting
    - StatusProcessing
    - StatusEmbedding
    - StatusEntities
    - StatusInferences
    - StatusTranscribing
    - StatusAnalyzingImage
    - StatusCompleted
    - StatusFailed
  textflow_internal_models.SourceClassificationResult:
    properties:
      classifier_version:
        type: string
      confidence:
        type: number
      document_type:
        description: e.g. "notariado", "catastro", "bancario"
        type: string
    type: object
info:
  contact: {}
paths:
  /v1/documents/{id}:
    delete:
      description: Remove a completed or failed job and its associated data.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
      summary: Delete a job
    get:
      description: Returns job status and current pipeline step. Does not include
        results — use /download for results.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Job status with current_step field
          schema:
            $ref: '#/definitions/textflow_internal_models.GetJobResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
      summary: Get job status
  /v1/documents/{id}/download:
    get:
      description: Returns gzip-compressed JSON results from filesystem. Only available
        when job status is completed.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      - description: Compression type (gzip)
        in: query
        name: compression
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'Gzip-compressed JSON (Content-Encoding: gzip)'
          schema:
            $ref: '#/definitions/textflow_internal_models.JobResults'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
      summary: Download job results
  /v1/documents/{id}/entities:
    get:
      description: Returns a flat list of all entities extracted from the document.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_orchestrator_handlers.EntitiesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
      summary: Get document entities
      tags:
      - documents
  /v1/documents/{id}/graph:
    get:
      description: Returns nodes and edges representing the document structure for
        graph database ingestion.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_orchestrator_handlers.GraphResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
      summary: Get document graph
      tags:
      - documents
  /v1/documents/{id}/inferences:
    get:
      description: Returns a flat list of all inferences with resolved entity_id_refs
        for knowledge graph construction.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_orchestrator_handlers.InferencesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
      summary: Get document inferences
      tags:
      - documents
  /v1/documents/{id}/vectors:
    get:
      description: Returns chunks and inferences with optional embeddings for vector
        database ingestion.
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Include embeddings (default: true)'
        in: query
        name: embeddings
        type: boolean
      - description: Comma-separated fields to include (chunks,inferences)
        in: query
        name: fields
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_orchestrator_handlers.VectorsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
      summary: Get document vectors
      tags:
      - documents
  /v1/documents/process:
    post:
      consumes:
      - application/json
      description: Submit a document for async processing. Returns job_id for polling.
      parameters:
      - description: Document processing request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/textflow_internal_models.CreateJobRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/textflow_internal_models.CreateJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
      summary: Process a document
  /v1/documents/upload:
    post:
      consumes:
      - multipart/form-data
      description: Upload a document via multipart/form-data for async processing.
      parameters:
      - description: Document file
        in: formData
        name: file
        required: true
        type: file
      - description: Filename
        in: formData
        name: filename
        type: string
      - description: Webhook URL for completion notification
        in: formData
        name: notify_webhook
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/textflow_internal_models.CreateJobResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/textflow_internal_models.ErrorResponse'
      summary: Upload a document
swagger: "2.0"
