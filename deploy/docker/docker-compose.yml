version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ia-text-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - datastore
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 512M
  redis:
    image: redis:7-alpine
    container_name: ia-text-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - datastore
    volumes:
    - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1536M
        reservations:
          memory: 1G
  orchestrator:
    build:
      context: ../../
      dockerfile: cmd/orchestrator/Dockerfile
    container_name: ia-text-orchestrator
    ports:
    - 8080:8080
    networks:
    - frontend
    - backend
    - datastore
    environment:
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - REDIS_URL=redis://redis:6379
    - DOCLING_URL=http://docling:5001
    - RESOURCE_MANAGER_URL=http://resource-manager:9090
    - HTTP_PORT=8080
    - LOG_LEVEL=info
    - JOB_TTL=24h
    - MAX_RETRIES=3
    - RETRY_DELAY=1s
    - WEBHOOK_URL=${WEBHOOK_URL:-}
    - API_BASE_URL=http://orchestrator:8080
    - UPLOAD_PATH=/app/data/uploads
    - RESULTS_PATH=/app/data/results
    - EXTRACT_QUEUE=extract_text
    - EMBEDDINGS_QUEUE=embeddings
    - ENTITIES_QUEUE=entities
    - METADATA_QUEUE=metadata
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      docling:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
    - uploads-data:/app/data/uploads
    - results-data:/app/data/results
  resource-manager:
    build:
      context: ../../
      dockerfile: cmd/resource-manager/Dockerfile
    container_name: ia-text-resource-manager
    environment:
    - LOG_LEVEL=info
    - HTTP_PORT=9090
    networks:
    - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
  extraction-worker:
    build:
      context: ../../
      dockerfile: cmd/extraction-worker/Dockerfile
    container_name: ia-text-extraction-worker
    volumes:
    - ../../data:/app/data:ro
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - DOCLING_URL=http://docling:5001
    - QUEUE_NAME=extract_text
    - PREFETCH_COUNT=3
    - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      docling:
        condition: service_healthy
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
  embeddings-worker:
    build:
      context: ../../
      dockerfile: cmd/embeddings-worker/Dockerfile
    container_name: ia-text-embeddings-worker
    volumes:
    - ../../models:/models
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - LOG_LEVEL=info
    - QUEUE_NAME=embeddings
    - METRICS_PORT=8001
    - PREFETCH_COUNT=5
    - HF_HUB_OFFLINE=0
    - GLINER_MODEL_PATH=/models/modern-gliner
    - GLINER_MODEL_NAME=knowledgator/modern-gliner-bi-base-v1.0
    - GLINER_PER_THRESHOLD=0.30
    - GLINER_ORG_THRESHOLD=0.35
    - GLINER_LOC_THRESHOLD=0.35
    - GLINER_DATE_THRESHOLD=0.45
    - GLINER_MONEY_THRESHOLD=0.55
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
  entities-worker:
    build:
      context: ../../
      dockerfile: cmd/entities-worker/Dockerfile
    container_name: ia-text-entities-worker
    mem_limit: 4g
    memswap_limit: 4g
    volumes:
    - ../../models:/models
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - LOG_LEVEL=info
    - QUEUE_NAME=entities
    - METRICS_PORT=8002
    - PREFETCH_COUNT=5
    - HF_HOME=/home/app/.cache/huggingface
    - GLINER_MODEL_PATH=/models/gliner_model
    - GLINER_MODEL_NAME=urchade/gliner_large-v2.1
    - MAX_LENGTH=384
    - ALLOW_REMOTE_DOWNLOAD=false
    - GLINER_PER_THRESHOLD=0.30
    - GLINER_ORG_THRESHOLD=0.35
    - GLINER_LOC_THRESHOLD=0.35
    - GLINER_DATE_THRESHOLD=0.45
    - GLINER_MONEY_THRESHOLD=0.55
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - backend
    - datastore
  metadata-worker:
    build:
      context: ../../
      dockerfile: cmd/metadata-worker/Dockerfile
    container_name: ia-text-metadata-worker
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - LOG_LEVEL=info
    - QUEUE_NAME=metadata
    - METRICS_PORT=8003
    - PREFETCH_COUNT=10
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
  completion-worker:
    build:
      context: ../../
      dockerfile: cmd/completion-worker/Dockerfile
    container_name: ia-text-completion-worker
    environment:
    - REDIS_URL=redis://redis:6379
    - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ia-text-prometheus
    ports:
    - 127.0.0.1:9091:9090
    volumes:
    - ../prometheus:/etc/prometheus
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    networks:
    - frontend
    restart: unless-stopped
  grafana:
    image: grafana/grafana:10.2.3
    container_name: ia-text-grafana
    ports:
    - 3000:3000
    environment:
    - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
    - grafana-data:/var/lib/grafana
    networks:
    - frontend
    restart: unless-stopped
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: ia-text-docling
    ports:
    - 8000:5001
    environment:
    - DOCLING_DEVICE=${DOCLING_DEVICE:-auto}
    - DOCLING_NUM_THREADS=${DOCLING_NUM_THREADS:-4}
    - LOG_LEVEL=info
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/openapi.json
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
    - backend
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  datastore:
    driver: bridge
    internal: true
volumes:
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  data:
    driver: local
  entities-cache:
    driver: local
  uploads-data:
    driver: local
  results-data:
    driver: local
