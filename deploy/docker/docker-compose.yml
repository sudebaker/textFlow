version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ia-text-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datastore
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: ia-text-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datastore
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1536M
        reservations:
          memory: 1G

  unstructured:
    image: quay.io/unstructured-io/unstructured-api:0.0.66
    container_name: ia-text-unstructured
    volumes:
      - ../../data:/app/data
    environment:
      - UNSTRUCTURED_API_VERSION=latest
      # ⭐ Use Tesseract OCR (CPU-only, no GPU models needed)
      - OCR_AGENT=unstructured.partition.utils.ocr_models.tesseract_ocr.OCRAgentTesseract
      # ⭐ Air-gapped mode
      - HF_HUB_OFFLINE=1
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/general/docs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  orchestrator:
    build:
      context: ../../
      dockerfile: cmd/orchestrator/Dockerfile
    container_name: ia-text-orchestrator
    ports:
      - "8080:8080"
    networks:
      - frontend
      - backend
      - datastore
    environment:
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - UNSTRUCTURED_URL=http://unstructured:8000
      - RESOURCE_MANAGER_URL=http://resource-manager:9090
      - HTTP_PORT=8080
      - LOG_LEVEL=info
      - JOB_TTL=24h
      - MAX_RETRIES=3
      - RETRY_DELAY=1s
      # ⭐ Queue names
      - EXTRACT_QUEUE=extract_text
      - EMBEDDINGS_QUEUE=embeddings
      - ENTITIES_QUEUE=entities
      - METADATA_QUEUE=metadata
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      unstructured:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  resource-manager:
    build:
      context: ../../
      dockerfile: cmd/resource-manager/Dockerfile
    container_name: ia-text-resource-manager
    environment:
      - LOG_LEVEL=info
      - HTTP_PORT=9090
    networks:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  extraction-worker:
    build:
      context: ../../
      dockerfile: cmd/extraction-worker/Dockerfile
    container_name: ia-text-extraction-worker
    volumes:
      # Mount data directory for local file access
      - ../../data:/app/data:ro
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - UNSTRUCTURED_URL=http://unstructured:8000
      - QUEUE_NAME=extract_text
      - PREFETCH_COUNT=3
      - LOG_LEVEL=info
      # ⭐ Air-gapped mode
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      unstructured:
        condition: service_healthy
    networks:
      - backend
      - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  embeddings-worker:
    build:
      context: ../../
      dockerfile: cmd/embeddings-worker/Dockerfile
    container_name: ia-text-embeddings-worker
    volumes:
      # Mount pre-downloaded models from project root
      - ../../models:/models:ro
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - LOG_LEVEL=info
      - QUEUE_NAME=embeddings
      - METRICS_PORT=8001
      - PREFETCH_COUNT=5
      # ⭐ Air-gapped mode enabled
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - MODEL_PATH=/models/bge-m3
      # ⭐ GPU Configuration
      - CUDA_VISIBLE_DEVICES=0
      - EMBEDDING_BATCH_SIZE_GPU=32
      - EMBEDDING_BATCH_SIZE_CPU=2
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - datastore
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
        limits:
          cpus: '4'
          memory: 4G
    healthcheck:
      test: ["CMD", "python3", "-c", "import torch; assert torch.cuda.is_available()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  entities-worker:
    build:
      context: ../../
      dockerfile: cmd/entities-worker/Dockerfile
    container_name: ia-text-entities-worker
    volumes:
      # Mount pre-downloaded models from project root
      - ../../models:/models:ro
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - LOG_LEVEL=info
      - QUEUE_NAME=entities
      - METRICS_PORT=8002
      - PREFETCH_COUNT=5
      # ⭐ Air-gapped mode enabled
      - HF_HUB_OFFLINE=1
      - GLINER_MODEL_PATH=/models/gliner-small
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  metadata-worker:
    build:
      context: ../../
      dockerfile: cmd/metadata-worker/Dockerfile
    container_name: ia-text-metadata-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
      - LOG_LEVEL=info
      - QUEUE_NAME=metadata
      - METRICS_PORT=8003
      - PREFETCH_COUNT=10
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  completion-worker:
    build:
      context: ../../
      dockerfile: cmd/completion-worker/Dockerfile
    container_name: ia-text-completion-worker
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ia-text-prometheus
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ../prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - frontend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: ia-text-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  datastore:
    driver: bridge
    internal: true

volumes:
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  data:
    driver: local