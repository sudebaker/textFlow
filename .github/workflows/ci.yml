name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  go-tests:
    name: Go Tests & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.22.5' ]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://test:test@localhost:5672/

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download && go mod verify

    - name: Run Go tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Install golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | \
        sh -s -- -b $(go env GOPATH)/bin v1.55.2

    - name: Run golangci-lint
      run: $(go env GOPATH)/bin/golangci-lint run ./...

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: go-coverage
        path: coverage.out

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.11' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        find cmd/*/requirements.txt -exec pip install -r {} \;
        pip install pytest pytest-cov

    - name: Install test dependencies
      run: |
        find cmd/*/requirements-test.txt -exec pip install -r {} \; 2>/dev/null || true
        find cmd/*/dev-requirements.txt -exec pip install -r {} \; 2>/dev/null || true

    - name: Run Python tests
      run: |
        for dir in cmd/*/tests; do
          if [ -d "$dir" ]; then
            echo "Running tests in $dir"
            python -m pytest "$dir" -v --tb=short || exit 1
          fi
        done

    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: python-coverage
        path: .coverage

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.5'

    - name: Check Go formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "Go code needs formatting:"
          gofmt -s -d .
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python formatting tools
      run: |
        pip install black isort

    - name: Check Python formatting
      run: |
        black --check cmd/ --line-length 120 || exit 1
        isort --check-only cmd/ --profile black || exit 1
