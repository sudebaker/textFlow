global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'textflow'
    environment: 'production'

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts.yml'

# Alert manager configuration (optional - for future integration)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Orchestrator service (Go)
  - job_name: 'orchestrator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['orchestrator:8080']
        labels:
          service: 'orchestrator'
          component: 'api'

  # Embeddings worker (Python)
  - job_name: 'embeddings-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['embeddings-worker:8001']
        labels:
          service: 'embeddings-worker'
          component: 'worker'

  # Entities worker (Python)
  - job_name: 'entities-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['entities-worker:8002']
        labels:
          service: 'entities-worker'
          component: 'worker'

  # Metadata worker (Python)
  - job_name: 'metadata-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['metadata-worker:8003']
        labels:
          service: 'metadata-worker'
          component: 'worker'

  # RabbitMQ metrics (if management plugin enabled)
  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: 'rabbitmq'
          component: 'queue'

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'
    scrape_interval: 15s

  # Resource manager (GPU metrics, spec 1.2)
  - job_name: 'resource-manager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['resource-manager:9090']
        labels:
          service: 'resource-manager'
          component: 'gpu'

  # Extraction worker (Python)
  - job_name: 'extraction-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['extraction-worker:8004']
        labels:
          service: 'extraction-worker'
          component: 'worker'

  # Image worker (Python)
  - job_name: 'image-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['image-worker:8006']
        labels:
          service: 'image-worker'
          component: 'worker'

  # Audio worker (Python)
  - job_name: 'audio-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['audio-worker:8005']
        labels:
          service: 'audio-worker'
          component: 'worker'

  # Inference worker (Python)
  - job_name: 'inference-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['inference-worker:8006']
        labels:
          service: 'inference-worker'
          component: 'worker'

  # Completion worker (Python)
  - job_name: 'completion-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['completion-worker:8005']
        labels:
          service: 'completion-worker'
          component: 'worker'
