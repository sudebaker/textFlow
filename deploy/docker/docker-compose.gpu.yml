# GPU override file — use with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
#
# Adds NVIDIA GPU support to workers that benefit from CUDA.
# The base docker-compose.yml defaults to CPU-only.
#
# Device bypass: nvidia-container-toolkit en este host mapea nvidia-uvm con
# major 511 (nvswitch) y el kernel espera 510 → --gpus/CDI cascan con
# "CUDA unknown error". Se tapan bind-mounting los device nodes + libs de
# /usr/lib directamente. Las libs DEBEN ir dentro de las volumes de cada
# servicio: un merge key `<<` se ensomberece si el servicio ya define
# `volumes:` (drop silencioso de libcuda.so.1).
x-gpu-devices: &gpu-devices
  devices:
  - /dev/nvidia0:/dev/nvidia0
  - /dev/nvidiactl:/dev/nvidiactl
  - /dev/nvidia-modeset:/dev/nvidia-modeset
  - /dev/nvidia-uvm:/dev/nvidia-uvm
  - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools

services:
  resource-manager:
    <<: *gpu-devices
    volumes:
    - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
    - /usr/lib/libcuda.so.1:/usr/lib/libcuda.so.1:ro
    - /usr/lib/libcuda.so:/usr/lib/libcuda.so:ro
    - /usr/lib/libnvidia-ml.so.1:/usr/lib/libnvidia-ml.so.1:ro
    - /usr/lib/libnvidia-ml.so:/usr/lib/libnvidia-ml.so:ro
    - /usr/lib/libnvidia-ptxjitcompiler.so.1:/usr/lib/libnvidia-ptxjitcompiler.so.1:ro
    - /usr/lib/libnvidia-ptxjitcompiler.so:/usr/lib/libnvidia-ptxjitcompiler.so:ro
    - /usr/lib/libnvidia-nvvm.so.4:/usr/lib/libnvidia-nvvm.so.4:ro
    - /usr/lib/libnvidia-nvvm.so:/usr/lib/libnvidia-nvvm.so:ro

  embeddings-worker:
    <<: *gpu-devices
    runtime: nvidia
    environment:
      - EMBEDDINGS_DEVICE=cuda
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
    - /usr/lib/libcuda.so.1:/usr/lib/libcuda.so.1:ro
    - /usr/lib/libcuda.so:/usr/lib/libcuda.so:ro
    - /usr/lib/libnvidia-ml.so.1:/usr/lib/libnvidia-ml.so.1:ro
    - /usr/lib/libnvidia-ml.so:/usr/lib/libnvidia-ml.so:ro
    - /usr/lib/libnvidia-ptxjitcompiler.so.1:/usr/lib/libnvidia-ptxjitcompiler.so.1:ro
    - /usr/lib/libnvidia-ptxjitcompiler.so:/usr/lib/libnvidia-ptxjitcompiler.so:ro
    - /usr/lib/libnvidia-nvvm.so.4:/usr/lib/libnvidia-nvvm.so.4:ro
    - /usr/lib/libnvidia-nvvm.so:/usr/lib/libnvidia-nvvm.so:ro

  entities-worker:
    <<: *gpu-devices
    runtime: nvidia
    environment:
      - ENTITIES_DEVICE=cuda
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
    volumes:
    - /usr/lib/libcuda.so.1:/usr/lib/libcuda.so.1:ro
    - /usr/lib/libcuda.so:/usr/lib/libcuda.so:ro
    - /usr/lib/libnvidia-ml.so.1:/usr/lib/libnvidia-ml.so.1:ro
    - /usr/lib/libnvidia-ml.so:/usr/lib/libnvidia-ml.so:ro
    - /usr/lib/libnvidia-ptxjitcompiler.so.1:/usr/lib/libnvidia-ptxjitcompiler.so.1:ro
    - /usr/lib/libnvidia-ptxjitcompiler.so:/usr/lib/libnvidia-ptxjitcompiler.so:ro
    - /usr/lib/libnvidia-nvvm.so.4:/usr/lib/libnvidia-nvvm.so.4:ro
    - /usr/lib/libnvidia-nvvm.so:/usr/lib/libnvidia-nvvm.so:ro

  completion-worker:
    runtime: nvidia
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0

  docling:
    image: quay.io/docling-project/docling-serve:cu128-0.12.0
    runtime: nvidia
    environment:
      - DOCLING_DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=0

  # Vision OCR serving (vLLM): MiniCPM-V 4.5. Alternative without GPU hardware:
  # point VISION_LLM_BASE_URL at any external OpenAI-compatible backend (e.g.
  # the dev Ollama on the mac-mini serving minicpm-v4.5:latest) and skip this
  # service entirely.
  # Pin exact: serve-test real en D.3/§21 (docs: soporte MiniCPMV >= v0.10.2)
  vllm-minicpm:
    image: vllm/vllm-openai:0.10.2
    runtime: nvidia
    volumes:
    - models-data:/models:ro
    command: >
      vllm serve /models/minicpm-v-4.5
      --served-model-name minicpm-v-4.5
      --max-model-len 4096
      --limit-mm-per-prompt image=1
      --gpu-memory-utilization 0.85
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=0
    networks:
    - docker_default
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
