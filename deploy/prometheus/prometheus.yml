global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ia-text-orchestrator'
    environment: 'production'

# Load alert rules
rule_files:
  - '/etc/prometheus/alerts.yml'

# Alert manager configuration (optional - for future integration)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Orchestrator service (Go)
  - job_name: 'orchestrator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['orchestrator:8080']
        labels:
          service: 'orchestrator'
          component: 'api'

  # Embeddings worker (Python)
  - job_name: 'embeddings-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['embeddings-worker:8001']
        labels:
          service: 'embeddings-worker'
          component: 'worker'

  # Entities worker (Python)
  - job_name: 'entities-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['entities-worker:8002']
        labels:
          service: 'entities-worker'
          component: 'worker'

  # Metadata worker (Python)
  - job_name: 'metadata-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['metadata-worker:8003']
        labels:
          service: 'metadata-worker'
          component: 'worker'

  # RabbitMQ metrics (if management plugin enabled)
  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']
        labels:
          service: 'rabbitmq'
          component: 'queue'

  # Redis exporter (optional - requires separate exporter container)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'redis'
  #         component: 'cache'
