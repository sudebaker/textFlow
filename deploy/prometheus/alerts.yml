groups:
  - name: textflow-vision
    interval: 30s
    rules:
      # Vision pages falling back with errors (quality-flow degradation)
      - alert: VisionPageErrorRateHigh
        expr: |
          sum(rate(extraction_worker_vision_pages_total{backend="vision_error"}[10m]))
          / sum(rate(extraction_worker_vision_pages_total[10m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High vision_error page rate on extraction slow path"
          description: "More than 20% of vision pages end backend=vision_error ({{ $value | humanizePercentage }}). Check VISION_OCR_URL/backend health."

      # Documents being degraded by exhausted vision budget (spec §19 degraded)
      - alert: VisionDegradationRateHigh
        expr: |
          sum(rate(extraction_worker_vision_pages_total{backend="degraded"}[10m]))
          / sum(rate(extraction_worker_vision_pages_total[10m])) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High degraded-page rate — vision budget exhausted per document"
          description: "More than 30% of pages end backend=degraded ({{ $value | humanizePercentage }}). Review VISION_OCR_MAX_PAGES_PER_DOCUMENT / MAX_SECONDS or thresholds."

      # vision-ocr service-side backend (vLLM/Ollama) failures
      - alert: VisionOCRBackendErrorRate
        expr: |
          sum(rate(vision_ocr_requests_total{outcome="error"}[5m]))
          / sum(rate(vision_ocr_requests_total{outcome=~".*"}[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "vision-ocr backend (LLM) error rate high"
          description: "More than 20% of transcribe requests ended outcome=error ({{ $value | humanizePercentage }}). Backend {{ $labels.backend }} failing."

      # vision-ocr saturation: 503s issued (semaphore backlog)
      - alert: VisionOCRSaturated
        expr: rate(vision_ocr_requests_total{outcome="saturated"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "vision-ocr returning 503 saturated"
          description: "Server-side semaphore exceeds queue-wait for 5+ minutes. Reduce worker VISION_OCR_MAX_CONCURRENCY or scale serving."

      # vision-ocr in-flight stuck at capacity (uses serving gauge)
      - alert: VisionOCRInFlightCapped
        expr: vision_ocr_in_flight >= vision_ocr_max_concurrency
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "vision-ocr in_flight at capacity for 10m"
          description: "GPU serving pinned at max concurrency for 10+ minutes — saturation risk or need of GPU capacity review."

  - name: textflow-critical
    interval: 30s
    rules:
      # Critical Alert 1: High Job Failure Rate
      - alert: HighJobFailureRate
        expr: |
          rate(ia_text_jobs_total{status="failed"}[5m]) /
          rate(ia_text_jobs_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High job failure rate detected"
          description: "More than 10% of jobs are failing ({{ $value | humanizePercentage }})"

      # Critical Alert 2: Jobs Stuck (not progressing)
      - alert: JobsStuck
        expr: |
          ia_text_jobs_in_progress > 0 AND
          rate(ia_text_jobs_total{status="completed"}[10m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Jobs not completing"
          description: "{{ $value }} jobs in progress but none completed in 10 minutes"

      # Critical Alert 3: Queue Saturation
      - alert: QueueSaturated
        expr: ia_text_queue_depth{queue=~".*"} > 500
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Queue {{ $labels.queue }} saturated"
          description: "Queue {{ $labels.queue }} has {{ $value }} unprocessed messages for 5+ minutes"

      # Critical Alert 4: Queue Growing Rapidly
      - alert: QueueGrowingRapidly
        expr: |
          rate(ia_text_queue_depth{queue=~".*"}[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.queue }} growing rapidly"
          description: "Queue depth increasing by {{ $value }} messages/second"

      # Critical Alert 5: Redis Errors
      - alert: RedisHighErrorRate
        expr: rate(ia_text_redis_errors_total[1m]) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redis experiencing high error rate"
          description: "{{ $value }} Redis errors per second in the last minute"

      # Critical Alert 6: RabbitMQ Errors
      - alert: RabbitMQHighErrorRate
        expr: rate(ia_text_rabbitmq_errors_total[1m]) > 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ experiencing high error rate"
          description: "{{ $value }} RabbitMQ errors per second"

      # Warning Alert 1: Slow Job Processing
      - alert: SlowJobProcessing
        expr: |
          histogram_quantile(0.95,
            rate(ia_text_job_duration_seconds_bucket[5m])
          ) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Jobs taking too long to process"
          description: "95th percentile job duration is {{ $value | humanizeDuration }}"

      # Warning Alert 2: High HTTP Error Rate
      - alert: HighHTTPErrorRate
        expr: |
          rate(ia_text_http_requests_total{status=~"5.."}[5m]) /
          rate(ia_text_http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "{{ $value | humanizePercentage }} of HTTP requests are failing with 5xx errors"

      # Warning Alert 3: Redis Slow Operations
      - alert: RedisSlowOperations
        expr: |
          histogram_quantile(0.95,
            rate(ia_text_redis_latency_seconds_bucket[5m])
          ) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis operations are slow"
          description: "95th percentile Redis latency is {{ $value | humanizeDuration }}"
