    properties:
      chunks:
        items:
          $ref: '#/definitions/textflow_internal_models.Chunk'
        type: array
      completed_at:
        type: string
      created_at:
        type: string
      document_metadata:
        additionalProperties: true
        type: object
      entities:
        additionalProperties:
          $ref: '#/definitions/textflow_internal_models.EntityMinimal'
