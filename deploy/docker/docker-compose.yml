version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ia-text-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - datastore
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 512M
  redis:
    image: redis:7-alpine
    container_name: ia-text-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - datastore
    volumes:
    - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1536M
        reservations:
          memory: 1G
  orchestrator:
    build:
      context: ../../
      dockerfile: cmd/orchestrator/Dockerfile
    container_name: ia-text-orchestrator
    ports:
    - 8080:8080
    networks:
    - frontend
    - backend
    - datastore
    environment:
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - REDIS_URL=redis://redis:6379
    - DOCLING_URL=http://docling:5001
    - RESOURCE_MANAGER_URL=http://resource-manager:9090
    - HTTP_PORT=8080
    - LOG_LEVEL=info
    - JOB_TTL=24h
    - MAX_RETRIES=3
    - RETRY_DELAY=1s
    - WEBHOOK_URL=${WEBHOOK_URL:-}
    - API_BASE_URL=http://orchestrator:8080
    - UPLOAD_PATH=/app/data/uploads
    - RESULTS_PATH=/app/data/results
    - EXTRACT_QUEUE=extract_text
    - EMBEDDINGS_QUEUE=embeddings
    - ENTITIES_QUEUE=entities
    - METADATA_QUEUE=metadata
    - INFERENCES_QUEUE=inferences
    - MAX_SPREADSHEET_ROWS=${MAX_SPREADSHEET_ROWS:-2000}
    - MAX_SPREADSHEET_SIZE_MB=${MAX_SPREADSHEET_SIZE_MB:-5}
    - JOB_TIMEOUT=5m
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
    - uploads-data:/app/data/uploads
    - results-data:/app/data/results
  resource-manager:
    build:
      context: ../../
      dockerfile: cmd/resource-manager/Dockerfile
    container_name: ia-text-resource-manager
    environment:
    - LOG_LEVEL=info
    - HTTP_PORT=9090
    networks:
    - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
  extraction-worker:
    build:
      context: ../../
      dockerfile: cmd/extraction-worker/Dockerfile
    container_name: ia-text-extraction-worker
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - DOCLING_URL=http://docling:5001
    - QUEUE_NAME=extract_text
    - PREFETCH_COUNT=3
    - LOG_LEVEL=info
    - METRICS_PORT=8004
    - TIKTOKEN_CACHE_DIR=/tmp/tiktoken_cache
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      docling:
        condition: service_healthy
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    volumes:
    - uploads-data:/app/data/uploads:ro
    - /tmp/tiktoken_cache:/tmp/tiktoken_cache
  embeddings-worker:
    build:
      context: ../../
      dockerfile: cmd/embeddings-worker/Dockerfile
    container_name: ia-text-embeddings-worker
    volumes:
    - ${MODELS_PATH:?MODELS_PATH is not set — copy .env.example to .env and set it}:/models
    environment:
    # ⭐ Offline mode (CRITICAL for air-gapped deployment)
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - LOG_LEVEL=info
    - QUEUE_NAME=embeddings
    - METRICS_PORT=8001
    - PREFETCH_COUNT=5
    - EMBEDDINGS_DEVICE=cuda
    - CUDA_VISIBLE_DEVICES=0
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
        reservations:
          cpus: '1'
          memory: 1G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  entities-worker:
    build:
      context: ../../
      dockerfile: cmd/entities-worker/Dockerfile
    container_name: ia-text-entities-worker
    volumes:
    - ${MODELS_PATH:?MODELS_PATH is not set — copy .env.example to .env and set it}:/models
    - ${MODELS_PATH:?MODELS_PATH is not set — copy .env.example to .env and set it}/huggingface_cache:/home/app/.cache/huggingface
    environment:
    # ⭐ Offline mode (CRITICAL for air-gapped deployment)
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - LOG_LEVEL=info
    - QUEUE_NAME=entities
    - METRICS_PORT=8002
    - PREFETCH_COUNT=5
    - HF_HOME=/home/app/.cache/huggingface
    - GLINER_MODEL_PATH=/models/gliner-small-v2.1
    - ALLOW_REMOTE_DOWNLOAD=false
    - MAX_LENGTH=384
    - GLINER_PER_THRESHOLD=0.30
    - GLINER_ORG_THRESHOLD=0.35
    - GLINER_LOC_THRESHOLD=0.35
    - GLINER_DATE_THRESHOLD=0.45
    - GLINER_MONEY_THRESHOLD=0.55
    - DEDUPLICATION_ENABLED=false
    - ENTITIES_DEVICE=cuda
    - CUDA_VISIBLE_DEVICES=0
    - ENTITY_TYPES=PERSON,ORGANIZATION,LOCATION,DATE,MONEY,EMAIL
    - REGEX_ENTITY_EXTRACTOR_URL=http://regex-entity-extractor:8081
    - INFERENCES_QUEUE=inferences
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      regex-entity-extractor:
        condition: service_healthy
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 6G
        reservations:
          cpus: '0.5'
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  inference-worker:
    build:
      context: ../../
      dockerfile: cmd/inference-worker/Dockerfile
    container_name: ia-text-inference-worker
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - LOG_LEVEL=info
    - QUEUE_NAME=inferences
    - METRICS_PORT=8006
    - PREFETCH_COUNT=3
    - LLM_URL=${LLM_URL:-http://vllm-qwen-2b:8000}
    - LLM_MODEL=${LLM_MODEL:-qwen3-coder}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
    - backend
    - datastore
    - docker_default
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
  regex-entity-extractor:
    build:
      context: ../../
      dockerfile: cmd/regex-entity-extractor/Dockerfile
    container_name: ia-text-regex-entity-extractor
    environment:
    - LOG_LEVEL=info
    - HTTP_PORT=8081
    ports:
    - 8081:8081
    networks:
    - backend
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:8081/health
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  metadata-worker:
    build:
      context: ../../
      dockerfile: cmd/metadata-worker/Dockerfile
    container_name: ia-text-metadata-worker
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672
    - LOG_LEVEL=info
    - QUEUE_NAME=metadata
    - METRICS_PORT=8003
    - PREFETCH_COUNT=10
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
  completion-worker:
    build:
      context: ../../
      dockerfile: cmd/completion-worker/Dockerfile
    container_name: ia-text-completion-worker
    environment:
    - REDIS_URL=redis://redis:6379
    - LOG_LEVEL=info
    - METRICS_PORT=8005
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: ia-text-docling
    ports:
    - 8000:5001
    volumes:
    - ${MODELS_PATH:?MODELS_PATH is not set — copy .env.example to .env and set it}/docling:/models/docling
    environment:
    - DOCLING_DEVICE=cuda:0
    - DOCLING_NUM_THREADS=${DOCLING_NUM_THREADS:-4}
    - DOCLING_SERVE_ARTIFACTS_PATH=/models/docling
    - LOG_LEVEL=info
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/openapi.json
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
    - backend
networks:
  docker_default:
    external: true
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  datastore:
    driver: bridge
    internal: true
volumes:
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  data:
    driver: local
  entities-cache:
    driver: local
  uploads-data:
    driver: local
  results-data:
    driver: local
