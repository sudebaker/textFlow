version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: textflow-rabbitmq
    command: 'sh -c "rabbitmq-plugins enable rabbitmq_delayed_message_exchange ||
      true && rabbitmq-server"

      '
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - datastore
    volumes:
    - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          memory: 512M
  redis:
    image: redis:7-alpine
    container_name: textflow-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - datastore
    volumes:
    - redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1536M
        reservations:
          memory: 1G
  orchestrator:
    build:
      context: ../../
      dockerfile: cmd/orchestrator/Dockerfile
    container_name: textflow-orchestrator
    ports:
    - 8080:8080
    networks:
    - frontend
    - backend
    - datastore
    environment:
    - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    - REDIS_URL=redis://redis:6379
    - DOCLING_URL=http://docling:5001
    - RESOURCE_MANAGER_URL=http://resource-manager:9090
    - HTTP_PORT=8080
    - LOG_LEVEL=debug
    - JOB_TTL=24h
    - MAX_RETRIES=3
    - RETRY_DELAY=1s
    - WEBHOOK_URL=${WEBHOOK_URL:-}
    - API_BASE_URL=http://orchestrator:8080
    - UPLOAD_PATH=/app/data/uploads
    - RESULTS_PATH=/app/data/results
    - EXTRACT_QUEUE=extract_text
    - EMBEDDINGS_QUEUE=embeddings
    - ENTITIES_QUEUE=entities
    - METADATA_QUEUE=metadata
    - INFERENCES_QUEUE=inferences
    - MAX_SPREADSHEET_ROWS=${MAX_SPREADSHEET_ROWS:-2000}
    - MAX_SPREADSHEET_SIZE_MB=${MAX_SPREADSHEET_SIZE_MB:-5}
    - MAX_DOCUMENT_SIZE_MB=${MAX_DOCUMENT_SIZE_MB:-10}
    - JOB_TIMEOUT=${JOB_TIMEOUT:-60m}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:8080/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
    - uploads-data:/app/data/uploads
    - results-data:/app/data/results
  resource-manager:
    build:
      context: ../../
      dockerfile: cmd/resource-manager/Dockerfile
    container_name: textflow-resource-manager
    environment:
    - LOG_LEVEL=debug
    - HTTP_PORT=9090
    networks:
    - backend
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:9090/health
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
  extraction-worker:
    build:
      context: ../../
      dockerfile: cmd/extraction-worker/Dockerfile
    container_name: textflow-extraction-worker
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    - DOCLING_URL=http://docling:5001
    - QUEUE_NAME=extract_text
    - PREFETCH_COUNT=10
    - LOG_LEVEL=debug
    - METRICS_PORT=8004
    - TIKTOKEN_CACHE_DIR=/tmp/tiktoken_cache
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      docling:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8004/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    volumes:
    - uploads-data:/app/data/uploads:ro
    - /tmp/tiktoken_cache:/tmp/tiktoken_cache
    - artifacts-data:/app/data/artifacts
  embeddings-worker:
    build:
      context: ../../
      dockerfile: cmd/embeddings-worker/Dockerfile
    container_name: textflow-embeddings-worker
    volumes:
    - "${MODELS_PATH:?MODELS_PATH is not set — copy .env.example to .env and\
      \ set it}:/models"
    - artifacts-data:/app/data/artifacts
    environment:
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    - LOG_LEVEL=debug
    - QUEUE_NAME=embeddings
    - METRICS_PORT=8001
    - PREFETCH_COUNT=20
    - EMBEDDINGS_DEVICE=${EMBEDDINGS_DEVICE:-cpu}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8001/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 6G
        reservations:
          cpus: '1'
          memory: 1G
  entities-worker:
    build:
      context: ../../
      dockerfile: cmd/entities-worker/Dockerfile
    container_name: textflow-entities-worker
    volumes:
    - "${MODELS_PATH:?MODELS_PATH is not set — copy .env.example to .env and\
      \ set it}:/models"
    - "${MODELS_PATH:?MODELS_PATH is not set — copy .env.example to .env and\
      \ set it}:/models"
    - artifacts-data:/app/data/artifacts
    environment:
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    - LOG_LEVEL=debug
    - QUEUE_NAME=entities
    - METRICS_PORT=8002
    - PREFETCH_COUNT=10
    - GLINER_MODEL_PATH=/models/gliner-small-v2.1
    - GLINER_BACKBONE_PATH=/models/deberta-v3-small
    - GLINER_PERSON_THRESHOLD=0.30
    - GLINER_ORG_THRESHOLD=0.35
    - GLINER_LOC_THRESHOLD=0.35
    - GLINER_DATE_THRESHOLD=0.45
    - GLINER_MONEY_THRESHOLD=0.55
    - DEDUPLICATION_ENABLED=false
    - ENTITIES_DEVICE=${ENTITIES_DEVICE:-cpu}
    - ENTITY_TYPES=PERSON,ORGANIZATION,LOCATION,DATE,MONEY,EMAIL
    - REGEX_ENTITY_EXTRACTOR_URL=http://regex-entity-extractor:8081
    - INFERENCES_QUEUE=inferences
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      regex-entity-extractor:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8002/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 6G
        reservations:
          cpus: '0.5'
          memory: 2G
  inference-worker:
    build:
      context: ../../
      dockerfile: cmd/inference-worker/Dockerfile
    extra_hosts:
    - "mac-mini:host-gateway"
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    - LOG_LEVEL=debug
    - QUEUE_NAME=inferences
    - METRICS_PORT=8006
    - PREFETCH_COUNT=3
    - LLM_URL=${LLM_URL:-http://vllm-qwen-2b:8000}
    - LLM_MODEL=${LLM_MODEL:-qwen3-coder}
    - INFERENCE_LLM_TIMEOUT=${INFERENCE_LLM_TIMEOUT:-300}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8006/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
    - backend
    - datastore
    - docker_default
    restart: unless-stopped
    deploy:
      replicas: ${INFERENCE_WORKER_REPLICAS:-4}
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
  regex-entity-extractor:
    build:
      context: ../../
      dockerfile: cmd/regex-entity-extractor/Dockerfile
    container_name: textflow-regex-entity-extractor
    environment:
    - LOG_LEVEL=debug
    - HTTP_PORT=8081
    networks:
    - backend
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - --quiet
      - --tries=1
      - --spider
      - http://localhost:8081/health
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
  metadata-worker:
    build:
      context: ../../
      dockerfile: cmd/metadata-worker/Dockerfile
    container_name: textflow-metadata-worker
    environment:
    - REDIS_URL=redis://redis:6379
    - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672
    - LOG_LEVEL=debug
    - QUEUE_NAME=metadata
    - METRICS_PORT=8003
    - PREFETCH_COUNT=10
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8003/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
    - backend
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    volumes:
    - artifacts-data:/app/data/artifacts
  completion-worker:
    build:
      context: ../../
      dockerfile: cmd/completion-worker/Dockerfile
    container_name: textflow-completion-worker
    env_file: .env
    environment:
    - REDIS_URL=redis://redis:6379
    - LOG_LEVEL=debug
    - METRICS_PORT=8005
    - RESULTS_PATH=/app/data/results
    volumes:
    - results-data:/app/data/results
    - ${MODELS_PATH:?MODELS_PATH is not set}/bge-m3:/models/bge-m3:ro
    - artifacts-data:/app/data/artifacts
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8005/health',
        timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
    - datastore
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 2G
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: textflow-redis-exporter
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
    - 9121:9121
    networks:
    - datastore
    - backend
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: textflow-docling
    ports:
    - 8000:5001
    environment:
    - DOCLING_DEVICE=${DOCLING_DEVICE:-cpu}
    - DOCLING_NUM_THREADS=${DOCLING_NUM_THREADS:-4}
    - LOG_LEVEL=debug
    - HF_HUB_OFFLINE=1
    - TRANSFORMERS_OFFLINE=1
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5001/openapi.json
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
    - backend
  image-worker:
    build:
      context: ../..
      dockerfile: cmd/image-worker/Dockerfile
    networks:
    - backend
    - datastore
    volumes:
    - uploads-data:/app/data/uploads
    environment:
    - RABBITMQ_URL=${RABBITMQ_URL}
    - REDIS_URL=${REDIS_URL}
    - MULTIMODAL_LLM_URLS=${MULTIMODAL_LLM_URLS:-http://vllm-service:8000}
    - MULTIMODAL_LLM_TIMEOUT=${MULTIMODAL_LLM_TIMEOUT:-120}
    - MULTIMODAL_LLM_MAX_RETRIES=${MULTIMODAL_LLM_MAX_RETRIES:-3}
    - IMAGE_QUEUE=image
    - METRICS_PORT=8006
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8006/metrics
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
    - rabbitmq
    - redis
  whisper:
    build:
      context: ./whisper
      dockerfile: Dockerfile
    container_name: textflow-whisper
    networks:
    - backend
    volumes:
    - ../../models/whisper:/models:ro
    environment:
    - DEVICE=${WHISPER_DEVICE:-cpu}
    - COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
    - MODEL_SIZE=${WHISPER_MODEL:-large-v2}
    - MODEL_PATH=/models
    - PORT=8080
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
  audio-worker:
    build:
      context: ../..
      dockerfile: cmd/audio-worker/Dockerfile
    networks:
    - backend
    - datastore
    volumes:
    - uploads-data:/app/data/uploads
    environment:
    - RABBITMQ_URL=${RABBITMQ_URL}
    - REDIS_URL=${REDIS_URL}
    - WHISPER_URLS=${WHISPER_URLS:-http://whisper:8080}
    - WHISPER_TIMEOUT=${WHISPER_TIMEOUT:-300}
    - WHISPER_MAX_RETRIES=${WHISPER_MAX_RETRIES:-3}
    - AUDIO_QUEUE=audio
    - AUDIO_CHUNK_MAX_CHARS=${AUDIO_CHUNK_MAX_CHARS:-1500}
    - MAX_AUDIO_SIZE_MB=${MAX_AUDIO_SIZE_MB:-500}
    - METRICS_PORT=8005
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8005/metrics
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
    - rabbitmq
    - redis
    - whisper
networks:
  docker_default:
    external: true
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  datastore:
    driver: bridge
    internal: true
volumes:
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  data:
    driver: local
  entities-cache:
    driver: local
  uploads-data:
    driver: local
  results-data:
    driver: local
  artifacts-data:
    driver: local
